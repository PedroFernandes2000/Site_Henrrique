# Configuração do Netlify para publicar o site corretamente
# Ajuste o "publish" para a pasta final do seu projeto, se necessário.

[build]
  command = "npm install && npm run build"
  publish = "dist"

# Redireciona todas as rotas para o index.html (útil em sites SPA/React/Vite)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Configuração de cache para arquivos estáticos
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Garante que o site responda corretamente com HTML
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
